name: xthings-attendance

services:
  db:
    image: postgres:16-alpine
    container_name: xthings_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xthings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xthings_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-xthings_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xthings} -d ${POSTGRES_DB:-xthings_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: xthings_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xthings}:${POSTGRES_PASSWORD:-xthings_dev_password}@db:5432/${POSTGRES_DB:-xthings_db}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
